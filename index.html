<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Comic Sans MS', cursive;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#ffd6e7,#ffeec9,#d8f3ff);
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.container{
    padding:20px;
    width:100%;
    max-width:500px;
    z-index:2;
}

h1{
    color:#ff4d88;
    font-size:2.2rem;
    margin-bottom:15px;
    animation:bounce 2s infinite;
}

.subtitle{
    color:#6a4c93;
    margin-bottom:25px;
    font-size:1rem;
}

.gift{
    font-size:110px;
    cursor:pointer;
    transition:0.4s;
    user-select:none;
}

.gift:hover{
    transform:scale(1.1) rotate(5deg);
}

.message{
    display:none;
    background:white;
    padding:20px;
    border-radius:20px;
    margin-top:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    animation:pop 0.8s ease;
}

.message h2{
    color:#ff4d88;
    margin-bottom:10px;
}

.message p{
    color:#555;
    line-height:1.6;
}

.play-btn{
    margin-top:15px;
    background:#ff69b4;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:30px;
    font-size:1rem;
    cursor:pointer;
}

.play-btn:hover{
    background:#ff4f9f;
}

.hearts{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.heart{
    position:absolute;
    color:#ff69b4;
    animation:floatUp linear infinite;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

@keyframes pop{
    from{
        transform:scale(0);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes floatUp{
    from{
        transform:translateY(100vh);
        opacity:1;
    }
    to{
        transform:translateY(-100px);
        opacity:0;
    }
}

@media(max-width:480px){
    h1{
        font-size:1.8rem;
    }
    .gift{
        font-size:90px;
    }
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="hearts" id="hearts"></div>

<div class="container">

<h1>🎂 Happy Birthday 🎂</h1>

<p class="subtitle">
Tap the gift to open your birthday surprise!
</p>

<div class="gift" onclick="openGift()">
🎁
</div>

<div class="message" id="message">
<h2>🎉 Surprise! 🎉</h2>

<p>
Wishing you a day filled with happiness, laughter,
love, cake, gifts, and unforgettable memories!
May all your dreams come true and your year ahead
be filled with amazing adventures. 💖✨
</p>

<button class="play-btn" onclick="showMoreLove()">
💝 More Birthday Magic
</button>
</div>

</div>

<script>
function openGift(){
    document.getElementById("message").style.display="block";
    startConfetti();
}

function showMoreLove(){
    alert("🌈 You are awesome!\n🎂 Have the happiest birthday ever!\n💖 Stay blessed and keep smiling!");
    startConfetti();
}

/* Floating Hearts */
const hearts=document.getElementById("hearts");

for(let i=0;i<25;i++){
    let heart=document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="💖";
    heart.style.left=Math.random()*100+"%";
    heart.style.fontSize=(15+Math.random()*25)+"px";
    heart.style.animationDuration=(4+Math.random()*6)+"s";
    heart.style.animationDelay=Math.random()*5+"s";
    hearts.appendChild(heart);
}

/* Cute Confetti */
const canvas=document.getElementById("confetti");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let confetti=[];

function startConfetti(){
    for(let i=0;i<180;i++){
        confetti.push({
            x:Math.random()*canvas.width,
            y:Math.random()*canvas.height-canvas.height,
            r:Math.random()*8+4,
            d:Math.random()*50,
            color:[
                "#ff69b4",
                "#ffd700",
                "#87cefa",
                "#98fb98",
                "#ff8fab"
            ][Math.floor(Math.random()*5)],
            tilt:Math.random()*10-10
        });
    }
}

function drawConfetti(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    confetti.forEach((c,index)=>{
        ctx.beginPath();
        ctx.fillStyle=c.color;
        ctx.fillRect(c.x,c.y,c.r,c.r);

        c.y+=2;
        c.x+=Math.sin(c.d);

        if(c.y>canvas.height){
            confetti.splice(index,1);
        }
    });

    requestAnimationFrame(drawConfetti);
}

drawConfetti();

window.addEventListener("resize",()=>{
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
});
</script>

</body>
</html>
